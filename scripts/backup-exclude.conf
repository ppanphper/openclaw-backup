# ──────────────────────────────────────────────────────────────────────────────
# OpenClaw 全卷备份排除规则配置文件
# 每行一条 glob 规则，空行和 # 开头的行会被忽略
# 用于 tar --exclude-from 参数
# ──────────────────────────────────────────────────────────────────────────────

# ── 运行时垃圾 & 进程占位符 ──
.DS_Store
logs
*.log
*.sock
*.ipc
*.pid

# ── 开发依赖 & 版本控制 ──
node_modules
.git

# ── 打包自身（防递归膨胀） ──
backups
*.tar.gz

# ── 大体积二进制/多媒体资源 ──
*.zip
*.skill
*.mp4
*.mp3
*.wav
*.png
*.jpg
*.jpeg
*.gif
*.webp

# ── OpenClaw 运行时缓存 ──
delivery-queue
browser
completions
canvas
media
